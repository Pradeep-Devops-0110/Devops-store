<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DevOps Store</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;background:#f3f6fb;color:#123}article{background:white;padding:18px;margin:12px;border-radius:12px;display:inline-block}button{padding:9px;background:#087e72;color:white;border:0;border-radius:6px}input{padding:9px}</style></head><body><h1>Local DevOps Store</h1><p>Payment simulator: use <b>demo-ok</b>; use <b>fail</b> to simulate decline. Never enter card details.</p><div id="products">Loading…</div><h2>Cart</h2><div id="cart"></div><input id="email" value="learner@example.com"><input id="token" value="demo-ok"><button onclick="checkout()">Place order</button><pre id="result"></pre><script>let ps=[],cart={};const dollars=n=>'$'+(n/100).toFixed(2);async function load(){ps=await(await fetch('/api/products')).json();document.querySelector('#products').innerHTML=ps.map(p=>`<article><h3>${p.name}</h3><p>${p.description}</p><b>${dollars(p.price_cents)}</b><p>Stock: ${p.stock}</p><button onclick="cart[${p.id}]=(cart[${p.id}]||0)+1;draw()">Add</button></article>`).join('')}function draw(){document.querySelector('#cart').innerHTML=Object.entries(cart).map(([id,q])=>`${ps.find(p=>p.id==id).name} × ${q}`).join('<br>')||'Empty'}async function checkout(){let items=Object.entries(cart).map(([product_id,quantity])=>({product_id:+product_id,quantity}));let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_email:document.querySelector('#email').value,items,payment_token:document.querySelector('#token').value})});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);load()}load()</script></body></html>
