services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: local_only_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20
  products:
    build: ./services/products
    environment:
      DATABASE_URL: postgresql://shop:local_only_change_me@db:5432/shop
    depends_on:
      db: {condition: service_healthy}
  payments:
    build: ./services/payments
  orders:
    build: ./services/orders
    environment:
      DATABASE_URL: postgresql://shop:local_only_change_me@db:5432/shop
      PAYMENT_URL: http://payments:8000
    depends_on:
      db: {condition: service_healthy}
      payments: {condition: service_started}
  web:
    build: ./web
    ports: ["8088:80"]
    depends_on: [products, orders]
volumes:
  pgdata:
