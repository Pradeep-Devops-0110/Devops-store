apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: store-services
  namespace: app-dev
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - app-dev
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - products
          - orders
          - payments
  endpoints:
    - port: http
      path: /metrics
      interval: 15s