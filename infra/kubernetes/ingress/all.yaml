apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: app-dev
spec:
  ingressClassName: nginx
  rules:
    - host: store.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
